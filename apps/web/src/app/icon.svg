  <path
    fill="#FFFFFF"
    fill-rule="evenodd"
    d="M19 13h17.5C44 13 49 17.6 49 24.6c0 5.3-3 9-7.7 10.4L50 51h-9.3l-7.9-15H27v15h-8V13Zm8 7v9h9c3.2 0 5-1.7 5-4.5S39.2 20 36 20h-9Z"
