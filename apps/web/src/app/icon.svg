<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Marca de REGB: la R en blanco sobre el azul de accion (tokens brand
       light #0066CC / dark #0071E3). La R es un trazo y no texto: un
