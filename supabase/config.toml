project_id = "regb-erp"

[api]
enabled = true
port = 54321
schemas = ["public", "regb", "audit"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "regb://auth"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false          # solo por invitacion; el alta la hace REGB Control

[auth.email]
enable_signup = false
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 3

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[inbucket]
enabled = true
port = 54324
