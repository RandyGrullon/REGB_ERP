# ═══════════════════════════════════════════════════════════════════════
#  Supabase en local (`npx supabase start`) — CLI 2.x
#
#  Espeja lo que docs/SUPABASE.md pide configurar en el proyecto real, para
#  que lo que funciona aqui funcione alla. Si cambias algo de Auth aqui,
#  cambialo tambien en esa guia (y al reves).
#
#  Puertos (los de fabrica de la CLI, 5432x): API 54321, base 54322,
#  Studio 54323, correo (Mailpit) 54324. La app en local es el 3100.
# ═══════════════════════════════════════════════════════════════════════
project_id = "regb-erp"

[api]
enabled = true
port = 54321
# Solo `public` en la Data API (PostgREST), igual que un proyecto nuevo y lo
# que recomienda docs/defi-v1.md §4.8: el movil solo usa tablas de `public`
# y las RPC `mi_rol` / `mis_modulos`; `regb` (el proveedor) y `audit` no
# tienen por que estar en internet. La web no usa PostgREST: va directo a
# Postgres con DATABASE_URL.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# 17 y no 16: la CLI solo trae imagenes 15 y 17 (con 16 falla con
# "Invalid db.major_version: 16"), y un proyecto nuevo en supabase.com
# nace en 17. El Postgres de pruebas (`regb-test-db`) sigue en 16.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# Las migraciones NO las aplica la CLI. Hay un solo camino, el mismo en
# local y en el proyecto real: `pnpm db:migrar` (scripts/aplicar-migraciones.mjs),
# que lleva su libro en `regb.migraciones_aplicadas` con el hash de cada
# archivo. Si la CLI tambien las aplicara, habria dos libros que no se
# conocen (docs/defi-v1.md §4.4) y `supabase start` correria las 140 y pico
# por su cuenta.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Correo de pruebas (Mailpit). Nada sale a internet: las invitaciones y los
# enlaces de acceso se ven en http://127.0.0.1:54324.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# La app en local corre en el 3100 (`pnpm dev`). Es la direccion que usan
# los correos cuando no hay `redirectTo`.
site_url = "http://localhost:3100"
# Adonde puede volver un enlace de Supabase. Sin la ruta de la invitacion
# aqui, Supabase ignora el `redirectTo` y manda al Site URL: el token de
# la invitacion se pierde. `regb://auth` es la app movil. El 3150 es la
# segunda instancia con la que se prueba el inicio de sesion real sin
# tocar la del 3100.
additional_redirect_urls = [
  "http://localhost:3100/**",
  "http://127.0.0.1:3100/**",
  "http://localhost:3150/**",
  "http://127.0.0.1:3150/**",
  "regb://auth",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Solo por invitacion: el alta la hace REGB Control y el equipo lo invita
# el dueño desde /usuarios.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
# En local no hay SMTP real; el tope de fabrica (2 por hora) solo estorba.
email_sent = 100

[auth.email]
# OJO: en la CLI esto enciende o apaga el PROVEEDOR de correo entero
# (GOTRUE_EXTERNAL_EMAIL_ENABLED), no solo el registro. Con `false` nadie
# entra por correo: "Email logins are disabled". El registro libre se
# cierra con `[auth] enable_signup = false`, arriba.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# La plantilla de fabrica de "Invite user" devuelve el token en el
# `#fragmento` de la URL, que el servidor nunca ve. Esta vuelve a
# /auth/invitacion/<token> con `token_hash`, y ahi el servidor abre la
# sesion con verifyOtp. En el proyecto real se pega el mismo HTML en
# Authentication → Emails → Invite user (docs/SUPABASE.md).
[auth.email.template.invite]
subject = "Te invitaron a REGB ERP"
content_path = "./supabase/templates/invitacion.html"

[auth.email.template.magic_link]
subject = "Tu enlace para entrar a REGB ERP"
content_path = "./supabase/templates/enlace-de-acceso.html"

# El hook que mete tenant_id, role_id e is_provider en el JWT (0008). Sin
# el, el token sale sin cliente y la RLS no deja ver nada. Es `rls.` y no
# `auth.`: en Supabase el esquema `auth` no es nuestro.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/rls/custom_access_token_hook"

[auth.mfa]
max_enrolled_factors = 3

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# La Edge Function que manda el correo de una invitacion. `verify_jwt`
# apagado a proposito: la funcion valida por su cuenta (con el JWT de
# quien invita, o con el token de la invitacion cuando el dueño todavia
# no tiene cuenta), y las llaves nuevas de Supabase (`sb_publishable_…`)
# no son JWT, asi que la puerta de fabrica las rechazaria.
[functions.invitar-usuario]
enabled = true
verify_jwt = false

# Apagado: en Windows exige exponer el daemon de Docker en tcp://localhost:2375
# y sin eso el contenedor no pasa el chequeo de salud y tumba `supabase start`.
# Solo sirve para ver logs en Studio; no lo usa nada del ERP.
[analytics]
enabled = false
port = 54327
backend = "postgres"
